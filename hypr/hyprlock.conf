```ini
general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 0.35)
}

# Clock
label {
    monitor =
    text = $TIME

    font_size = 60
    font_family = Adwaita Sans Bold
    color = rgba(255, 255, 255, 0.9)

    position = 0, 70
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"

    font_size = 22
    font_family = Adwaita Sans
    color = rgba(255, 255, 255, 0.7)

    position = 0, 0
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =

    size = 300, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 255, 255, 0.9)

    fade_on_empty = false
    placeholder_text = Password...

    position = 0, -70
    halign = center
    valign = center
}
```

This gives you roughly:

**Clock**
*Monday, 28 September 2026*

`[       Password...       ]`

with the desktop still visible through the lock screen.

